- question: "How much does an initial consultation cost?"
  answer: >
    The first consultation is free for personal injury and criminal defense matters.
    Family law, estate planning, and business consultations are billed at a flat rate,
    which is applied to your case if you retain the firm.
- question: "Do you work on contingency?"
  answer: >
    Personal injury cases are handled on a contingency fee basis, meaning you pay
    nothing upfront and no fee unless we recover compensation on your behalf.
- question: "Which courts do you practice in?"
  answer: >
    Daniel appears regularly in the Circuit Court of Cook County and the U.S. District
    Court for the Northern District of Illinois, and is licensed to practice throughout
    the state of Illinois.
- question: "How quickly can I get an appointment?"
  answer: >
    Most new clients are offered a consultation within two business days. Urgent
    criminal matters are prioritized and can often be scheduled the same day.
