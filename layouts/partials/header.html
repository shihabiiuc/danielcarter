<header class="site-header" data-site-header>
  <div class="wrap site-header__inner">
    <a href="/" class="brand">
      <span class="brand__mark" aria-hidden="true">DC</span>
      <span class="brand__text">
        <span class="brand__name">{{ .Site.Params.firmName }}</span>
        <span class="brand__sub">Attorney at Law</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <ul class="main-nav__list">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}aria-current="page"{{ end }}>{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>

    <div class="site-header__actions">
      <a class="phone-link" href="tel:{{ .Site.Params.phoneHref }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        {{ .Site.Params.phoneDisplay }}
      </a>
      <a class="btn btn--gold btn--sm" href="/contact/">Free Consultation</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav" data-nav-toggle>
        <span class="sr-only">Toggle menu</span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
    </div>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile" data-mobile-nav>
    <ul>
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <a class="btn btn--gold btn--block" href="/contact/">Free Consultation</a>
    <a class="mobile-nav__phone" href="tel:{{ .Site.Params.phoneHref }}">{{ .Site.Params.phoneDisplay }}</a>
  </nav>
</header>
