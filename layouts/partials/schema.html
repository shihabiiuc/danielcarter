{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Attorney",
  "name": "{{ .Site.Params.attorneyName }}",
  "image": "{{ .Site.Params.ogImage | absURL }}",
  "url": "{{ .Site.BaseURL }}",
  "telephone": "{{ .Site.Params.phoneHref }}",
  "email": "{{ .Site.Params.email }}",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ .Site.Params.addressStreet }}",
    "addressLocality": "Chicago",
    "addressRegion": "IL",
    "postalCode": "60661",
    "addressCountry": "US"
  },
  "areaServed": {
    "@type": "City",
    "name": "Chicago"
  },
  "founder": {
    "@type": "Person",
    "name": "{{ .Site.Params.attorneyName }}",
    "jobTitle": "{{ .Site.Params.attorneyTitle }}"
  },
  "openingHours": "Mo-Fr 08:30-18:00"
}
</script>
{{- end }}

{{- if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ .Site.BaseURL }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{- end }}

{{- if .Params.schema_faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $f := .Site.Data.faq }}
    {{ if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $f.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $f.answer | jsonify }}
      }
    }
    {{- end }}
  ]
}
</script>
{{- end }}
